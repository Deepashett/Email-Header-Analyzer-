<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Email Header Analyzer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Email Header Analyzer</h1>
        <form method="POST" enctype="multipart/form-data">
            <label>Paste Email Header:</label>
            <textarea name="header" placeholder="Paste the header here..."></textarea>
            <p>Or Upload Header File (.txt or .eml):</p>
            <input type="file" name="file">
            <button type="submit">Analyze</button>
        </form>

        {% if result %}
        <div class="results">
            <h2>Analysis Results</h2>
            <ul>
                {% for item in result %}
                <li>{{ item }}</li>
                {% endfor %}
            </ul>
        </div>
        {% endif %}

        <footer>
            <p>Developed by Deepa | BCA Project | 2025</p>
        </footer>
    </div>
</body>
</html>
