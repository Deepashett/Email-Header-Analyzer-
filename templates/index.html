<!DOCTYPE html>
<html>
<head>
    <title>Email Header Analyzer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>Email Header Analyzer</h2>

    <form method="POST" enctype="multipart/form-data">
        <div class="mb-3">
            <label for="header" class="form-label">Paste Email Header</label>
            <textarea name="header" class="form-control" rows="10"></textarea>
        </div>

        <div class="mb-3">
            <label for="file" class="form-label">Or Upload Header File (.txt or .eml)</label>
            <input type="file" name="file" class="form-control">
        </div>

        <button type="submit" class="btn btn-primary">Analyze</button>
    </form>

    {% if result %}
    <div class="mt-4">
        <h4>Analysis Results:</h4>
        <ul class="list-group">
            {% for item in result %}
            <li class="list-group-item {% if '⚠️' in item %}list-group-item-danger{% else %}list-group-item-success{% endif %}">
                {{ item }}
            </li>
            {% endfor %}
        </ul>
    </div>
    {% endif %}

    {% if score %}
    <div class="mt-3">
        <h5>Confidence Score:</h5>
        <span class="badge {% if score == 'Low Risk' %}bg-success{% elif score == 'Medium Risk' %}bg-warning text-dark{% else %}bg-danger{% endif %}">
            {{ score }}
        </span>
    </div>
    {% endif %}
</div>
</body>
</html>
